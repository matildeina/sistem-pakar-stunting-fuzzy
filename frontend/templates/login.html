<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token() }}">

<title>Login - TumbuhCerah</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">

<style>
/* ── MODAL OVERLAY ── */
.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(4px);
    z-index: 999;
    align-items: center;
    justify-content: center;
}
.modal-overlay.show {
    display: flex;
}

/* ── MODAL BOX ── */
.modal-box {
    background: #fff;
    border-radius: 20px;
    padding: 36px 32px 28px;
    max-width: 360px;
    width: 90%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    animation: popIn 0.25s ease;
}
@keyframes popIn {
    from { transform: scale(0.85); opacity: 0; }
    to   { transform: scale(1);    opacity: 1; }
}

/* ── ICON ── */
.modal-icon {
    font-size: 52px;
    line-height: 1;
    margin-bottom: 12px;
}

/* ── TITLE ── */
.modal-title {
    font-family: 'Fraunces', serif;
    font-size: 1.25rem;
    font-weight: 700;
    margin-bottom: 8px;
    color: #1a1a2e;
}

/* ── MESSAGE ── */
.modal-message {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    color: #555;
    margin-bottom: 24px;
    line-height: 1.5;
}

/* ── BUTTON ── */
.modal-btn {
    display: inline-block;
    padding: 10px 32px;
    border-radius: 50px;
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    transition: opacity 0.2s;
}
.modal-btn:hover { opacity: 0.85; }

/* ── SUCCESS ── */
.modal-box.success .modal-btn {
    background: #3d7a5e;
    color: #fff;
}

/* ── ERROR ── */
.modal-box.error .modal-title { color: #c0392b; }
.modal-box.error .modal-btn {
    background: #c0392b;
    color: #fff;
}
</style>
</head>

<body>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box" id="modalBox">
        <div class="modal-icon" id="modalIcon"></div>
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-message" id="modalMessage"></div>
        <button class="modal-btn" id="modalBtn" onclick="closeModal()">Oke</button>
    </div>
</div>

<div class="auth-container">
    <div class="auth-card">

        <div class="logo">
            <h1>Tumbuh<em>Cerah</em></h1>
            <p>Sistem Pakar Deteksi Stunting</p>
        </div>

        <h2 class="auth-title">Selamat Datang 👋</h2>

        <p class="auth-subtitle">
            Login untuk mengakses riwayat konsultasi dan dashboard.
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Masukkan username" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required>
            </div>

            <button type="submit" class="btn-auth" id="submitBtn">
                Login
            </button>

        </form>

        <div class="auth-footer">
            Belum punya akun?
            <a href="/register">Daftar Sekarang</a>
        </div>

    </div>

    <a href="/" class="back-home">← Kembali ke Beranda</a>
</div>

<script>
let modalCallback = null;

function showModal(type, title, message, callback = null) {
    const overlay = document.getElementById('modalOverlay');
    const box     = document.getElementById('modalBox');
    const icon    = document.getElementById('modalIcon');
    const ttl     = document.getElementById('modalTitle');
    const msg     = document.getElementById('modalMessage');

    box.className = 'modal-box ' + type;
    icon.textContent = type === 'success' ? '✅' : '❌';
    ttl.textContent  = title;
    msg.textContent  = message;

    modalCallback = callback;
    overlay.classList.add('show');
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
    if (modalCallback) {
        modalCallback();
        modalCallback = null;
    }
}

// Tutup modal kalau klik di luar box
document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

document.getElementById("loginForm")
.addEventListener("submit", async (e) => {
    e.preventDefault();

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Memproses...';

    const username  = document.getElementById("username").value;
    const password  = document.getElementById("password").value;
    const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

    try {
        const response = await fetch("/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": csrfToken
            },
            body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
            showModal(
                'success',
                'Login Berhasil!',
                `Selamat datang kembali 👋`,
                () => { window.location.href = data.redirect; }
            );
        } else {
            showModal('error', 'Login Gagal', data.error);
            submitBtn.disabled = false;
            submitBtn.textContent = 'Login';
        }

    } catch (err) {
        showModal('error', 'Terjadi Kesalahan', 'Gagal terhubung ke server. Coba lagi.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Login';
    }
});
</script>

</body>
</html>
