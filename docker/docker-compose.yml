services:

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: tumbuhcerah_backend
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=tumbuh_cerah_super_secret_key_2026
      - DATABASE_URL=sqlite:///tumbuh_cerah.db
      - FLASK_ENV=production
      - AZURE_CONNECTION_STRING=${AZURE_CONNECTION_STRING}
      - AZURE_CONTAINER_NAME=foto-anak
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - ../backend/instance:/app/instance
      - ../backend/logs:/app/logs
      - ../frontend:/frontend
    restart: unless-stopped
    networks:
      - tumbuhcerah_net

  nginx:
    image: nginx:alpine
    container_name: tumbuhcerah_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ../frontend/templates:/usr/share/nginx/html
      - ../frontend/static:/usr/share/nginx/html/static
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - tumbuhcerah_net

networks:
  tumbuhcerah_net:
    driver: bridge