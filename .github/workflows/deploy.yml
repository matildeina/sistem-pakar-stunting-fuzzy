name: CI/CD TumbuhCerah

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ── STAGE 1: BUILD & TEST ──
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Test import app
        run: |
          cd backend
          python -c "from app import create_app; app = create_app(); print('Build OK')"

  # ── STAGE 2: DOCKERIZE & PUSH ──
  dockerize:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login ke Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/tumbuhcerah:latest

  # ── STAGE 3: DEPLOY KE AWS EC2 ──
  deploy:
    needs: dockerize
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy ke AWS EC2 via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/sistem-pakar-stunting-fuzzy
            git pull origin main
            docker pull ${{ secrets.DOCKER_USERNAME }}/tumbuhcerah:latest
            cd docker
            docker-compose down
            docker-compose up -d
            echo "Deploy selesai!"